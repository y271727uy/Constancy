modLoader = "javafml"
loaderVersion = "*"
license = "LGPL-3.0-only"
issueTrackerURL = "https://github.com/ThinkingStudios/Constancy/issues"

[[mods]]
modId = "constancy"
version = "${version}"
displayName = "Constancy"
description = '''
Constancy is a Forge compatibility mod that delegates connected textures, emissive rendering, and related model work to ConnectedTexturesMod (CTM).
'''
logoFile = "icon.png"
logoBlur = false
authors = "TexTrue, PepperCode1"
displayURL = "https://github.com/ThinkingStudios/Constancy"

[[mods]]
modId = "continuity"
version = "${version}"
displayName = "Continuity (Stub)"
description = '''
Constancy compatibility stub for mods that check the legacy Continuity mod ID.
'''
logoFile = "assets/continuity/icon.png"
logoBlur = false
authors = "PepperCode1"

[[dependencies.constancy]]
modId = "ctm"
mandatory = true
versionRange = "[1.20.1-1.1.10,)"
ordering = "AFTER"
side = "CLIENT"

[[dependencies.constancy]]
modId = "minecraft"
mandatory = true
versionRange = "[1.20.1]"
