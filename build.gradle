plugins {
	id 'dev.architectury.loom' version '1.13.469'
	id 'maven-publish'
}

version = project.mod_version + '+' + project.minecraft_version + '.forge' + getExtraBuildMetadata()
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

static String getExtraBuildMetadata() {
	String buildNumber = System.getenv('GITHUB_RUN_NUMBER')
	if (buildNumber != null) {
		return ".build.${buildNumber}"
	}
	return ''
}

repositories {
	maven {
		name 'TerraformersMC'
		url 'https://maven.terraformersmc.com'
	}
	maven {
		name 'Modrinth'
		url 'https://api.modrinth.com/maven'
	}
	maven {
		name 'Shedaniel'
		url 'https://maven.shedaniel.me'
	}

	maven {
		name 'CurseMaven'
		url 'https://www.cursemaven.com'
	}
}

loom {
	forge {
		// CTM owns model wrapping; Continuity's legacy Fabric mixins are disabled.
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	forge "net.minecraftforge:forge:${project.minecraft_version}-${project.forge_version}"

	modCompileOnly("curse.maven:ctm-267602:${project.ctm_file_id}")
	modRuntimeOnly("curse.maven:ctm-267602:${project.ctm_file_id}")
}

processResources {
	inputs.property 'version', project.version

	filesMatching("META-INF/mods.toml") {
		expand 'version': project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 17
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

jar {
	from('LICENSE') {
		rename { "${it}_${project.base.archivesName.get()}" }
	}
}

// configure the maven publication
publishing {
	publications {
		create('mavenJava', MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
